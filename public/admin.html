<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SwiftLogix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#fff;min-height:100vh}
        
        .navbar{position:sticky;top:0;z-index:1000;padding:1rem 5%;background:rgba(10,14,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(108,27,140,0.2)}
        .nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo img{height:50px;width:auto;display:block;transition:all 0.3s ease}
        .logo img:hover{transform:scale(1.05);filter:brightness(1.1)}
        .admin-info{display:flex;align-items:center;gap:1rem}
        .admin-info span{color:#9aa8c9;font-size:0.8rem}
        .admin-info .logout-btn{background:rgba(255,68,68,0.1);padding:0.5rem 1.5rem;border-radius:50px;color:#ff4444;border:1px solid rgba(255,68,68,0.2);cursor:pointer;transition:all 0.3s;font-weight:600}
        .admin-info .logout-btn:hover{background:rgba(255,68,68,0.2)}

        .admin-page{padding:8rem 5% 4rem;max-width:1400px;margin:0 auto}
        .admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:2rem}
        .admin-header .left h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,#6C1B8C,#FF6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .admin-header .left .welcome{color:#9aa8c9;font-size:0.9rem}
        .admin-header .right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
        .admin-header .right .stats-badge{background:rgba(108,27,140,0.1);padding:0.5rem 1.5rem;border-radius:50px;font-size:0.9rem;border:1px solid rgba(108,27,140,0.2)}
        .admin-header .right .admin-actions{display:flex;gap:0.5rem;flex-wrap:wrap}
        .admin-header .right .admin-actions a{padding:0.5rem 1.2rem;border-radius:50px;font-size:0.85rem;font-weight:600;text-decoration:none;transition:all 0.3s}
        .admin-header .right .admin-actions .chat-link{background:rgba(108,27,140,0.1);color:#8B3AB8;border:1px solid rgba(108,27,140,0.2)}
        .admin-header .right .admin-actions .chat-link:hover{background:rgba(108,27,140,0.2)}
        .admin-header .right .admin-actions .logout-btn{background:rgba(255,68,68,0.1);color:#ff4444;border:1px solid rgba(255,68,68,0.2);cursor:pointer}
        .admin-header .right .admin-actions .logout-btn:hover{background:rgba(255,68,68,0.2)}

        .admin-toolbar{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
        .admin-toolbar .btn-primary{padding:0.8rem 1.8rem;font-size:0.9rem;background:linear-gradient(135deg,#6C1B8C,#FF6600);border:none;border-radius:60px;color:#fff;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:0.5rem}
        .admin-toolbar .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(108,27,140,0.3)}
        .admin-toolbar .btn-secondary{padding:0.8rem 1.8rem;font-size:0.9rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:60px;color:#fff;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:0.5rem}
        .admin-toolbar .btn-secondary:hover{background:rgba(255,255,255,0.1)}
        .admin-toolbar .search-box{flex:1;min-width:200px;display:flex;gap:0.5rem}
        .admin-toolbar .search-box input{flex:1;padding:0.8rem 1.5rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:60px;color:#fff;font-size:0.9rem}
        .admin-toolbar .search-box input:focus{outline:none;border-color:#6C1B8C}
        .admin-toolbar .search-box input::placeholder{color:#667799}

        .table-container{background:rgba(255,255,255,0.03);border-radius:24px;overflow-x:auto;border:1px solid rgba(255,255,255,0.05)}
        table{width:100%;border-collapse:collapse;min-width:1100px}
        th,td{padding:1rem;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05)}
        th{color:#8B3AB8;font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;background:rgba(108,27,140,0.05)}
        tr:hover{background:rgba(255,255,255,0.02)}

        .status-badge{display:inline-block;padding:0.2rem 0.8rem;border-radius:50px;font-size:0.7rem;font-weight:600}
        .status-order_confirmed{background:rgba(108,27,140,0.2);color:#8B3AB8}
        .status-picked{background:rgba(255,165,0,0.2);color:#ffa500}
        .status-onway{background:rgba(0,255,255,0.2);color:#0ff}
        .status-customs{background:rgba(255,68,68,0.2);color:#ff4444}
        .status-delivered{background:rgba(0,255,0,0.2);color:#0f0}

        .duty-badge{display:inline-block;padding:0.2rem 0.5rem;border-radius:20px;font-size:0.7rem}
        .duty-paid{background:rgba(0,255,0,0.2);color:#0f0}
        .duty-pending{background:rgba(255,165,0,0.2);color:#ffa500}

        .action-buttons{display:flex;gap:0.5rem;flex-wrap:wrap}
        .action-btn{background:none;border:none;color:#9aa8c9;cursor:pointer;font-size:0.9rem;padding:0.3rem 0.6rem;border-radius:8px;transition:all 0.3s}
        .action-btn:hover{color:#8B3AB8;background:rgba(108,27,140,0.1)}
        .action-btn.delete:hover{color:#ff4444;background:rgba(255,68,68,0.1)}
        .action-btn.email-btn:hover{color:#4CAF50;background:rgba(76,175,80,0.1)}

        .empty-state{text-align:center;padding:4rem 2rem;color:#9aa8c9}
        .empty-state i{font-size:3rem;margin-bottom:1rem;color:#667799}
        .email-sent{color:#4CAF50;font-size:0.7rem}
        .email-not-sent{color:#ffa500;font-size:0.7rem}

        .footer{background:#060a16;padding:2rem 5%;text-align:center;border-top:1px solid rgba(108,27,140,0.2);margin-top:4rem}
        .footer p{color:#667799;font-size:13px}

        @media(max-width:768px){
            .admin-header{flex-direction:column;align-items:flex-start}
            .admin-toolbar{flex-direction:column}
            .admin-toolbar .search-box{width:100%}
            .logo img{height:40px}
        }
        @media(max-width:480px){.logo img{height:35px}}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="/images/logo.png" alt="SwiftLogix">
            </a>
            <div class="admin-info">
                <span><i class="fas fa-user-shield"></i> <span id="adminName">Admin</span></span>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="admin-page">
        <div class="admin-header">
            <div class="left">
                <h1><i class="fas fa-crown"></i> Shipment Management</h1>
                <div class="welcome">Welcome back, <span id="adminWelcome">Admin</span>!</div>
            </div>
            <div class="right">
                <div class="stats-badge"><i class="fas fa-box"></i> <span id="shipmentCount">0</span> Total Shipments</div>
                <div class="admin-actions">
                    <a href="admin-chat.html" class="chat-link"><i class="fas fa-comment-dots"></i> Chat Support</a>
                    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </div>

        <div class="admin-toolbar">
            <button class="btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Shipment</button>
            <button class="btn-secondary" onclick="loadShipments()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by tracking, sender, receiver..." oninput="searchShipments(this.value)">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Tracking #</th><th>Status</th><th>Sender</th><th>Receiver</th><th>Weight</th><th>Duty</th><th>Total</th><th>Invoice</th><th>Actions</th></tr>
                </thead>
                <tbody id="shipmentsList">
                    <tr><td colspan="9" class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading shipments...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 SwiftLogix Logistics. All rights reserved.</p>
    </footer>

    <script>
        const API_URL = window.location.origin;
        let shipments = [];

        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            if (!token) { window.location.href = 'admin-login.html'; return false; }
            return true;
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUsername');
            window.location.href = 'admin-login.html';
        }

        async function loadShipments() {
            if (!checkAuth()) return;
            try {
                const response = await fetch(`${API_URL}/api/admin/shipments`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                if (response.status === 401) { logout(); return; }
                if (!response.ok) throw new Error('Failed to load');
                shipments = await response.json();
                renderTable(shipments);
                document.getElementById('shipmentCount').textContent = shipments.length;
                const username = localStorage.getItem('adminUsername') || 'Admin';
                document.getElementById('adminName').textContent = username;
                document.getElementById('adminWelcome').textContent = username;
            } catch (error) {
                document.getElementById('shipmentsList').innerHTML = `<tr><td colspan="9" class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ff4444;"></i><br>Error loading shipments. Please refresh.</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('shipmentsList');
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-state"><i class="fas fa-box-open"></i><br>No shipments found. Click "Add Shipment" to create one.</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(s => {
                const statusClass = `status-${s.status}`;
                const dutyClass = s.parcel?.dutyFeesStatus === 'Paid' ? 'duty-paid' : 'duty-pending';
                const inv = s.invoice || {};
                const invoiceSent = s.invoiceSent ? `<span class="email-sent"><i class="fas fa-check-circle"></i> Sent</span>` :
                                   `<span class="email-not-sent"><i class="fas fa-clock"></i> Pending</span>`;
                return `<tr>
                    <td><code style="font-family:monospace;font-size:0.85rem;">${s.trackingCode}</code></td>
                    <td><span class="status-badge ${statusClass}">${s.statusText || s.status}</span></td>
                    <td>${s.sender?.name || 'N/A'}<br><small style="color:#667799;">${s.sender?.country || ''}</small></td>
                    <td>${s.receiver?.name || 'N/A'}<br><small style="color:#667799;">${s.receiver?.country || ''}</small></td>
                    <td>${s.parcel?.weight || 'N/A'}</td>
                    <td><span class="duty-badge ${dutyClass}">${s.parcel?.dutyFeesStatus || 'N/A'}</span></td>
                    <td>${inv.totalAmount || 'N/A'}</td>
                    <td>${invoiceSent}</td>
                    <td class="action-buttons">
                        <button class="action-btn" onclick="editShipment('${s.trackingCode}')" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete" onclick="deleteShipment('${s.trackingCode}')" title="Delete"><i class="fas fa-trash"></i></button>
                        <button class="action-btn email-btn" onclick="sendInvoice('${s.trackingCode}')" title="Send Invoice"><i class="fas fa-envelope"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function searchShipments(query) {
            if (!query.trim()) { renderTable(shipments); return; }
            try {
                const response = await fetch(`${API_URL}/api/admin/search/${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                if (!response.ok) throw new Error('Search failed');
                const results = await response.json();
                renderTable(results);
            } catch (error) { console.error('Search error:', error); }
        }

        function openAddModal() {
            alert('Add shipment modal would open here');
        }

        function editShipment(code) {
            alert('Edit shipment: ' + code);
        }

        async function deleteShipment(code) {
            if (!confirm(`⚠️ Delete shipment ${code}? This cannot be undone.`)) return;
            try {
                const response = await fetch(`${API_URL}/api/admin/shipments/${code}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                if (!response.ok) throw new Error('Delete failed');
                alert(`✅ Shipment ${code} deleted successfully!`);
                loadShipments();
            } catch (error) { alert('Error: ' + error.message); }
        }

        async function sendInvoice(code) {
            if (!confirm(`📧 Send invoice for ${code} to the receiver's email?`)) return;
            try {
                const response = await fetch(`${API_URL}/api/admin/shipments/${code}/send-invoice`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Failed to send');
                alert(`✅ Invoice sent successfully to ${result.recipient || 'receiver'}!`);
                loadShipments();
            } catch (error) { alert('Error: ' + error.message); }
        }

        checkAuth();
        loadShipments();
    </script>
</body>
</html>
