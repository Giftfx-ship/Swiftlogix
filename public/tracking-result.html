        @media (max-width: 768px) { .menu-toggle { display: block; } .nav-links { position: fixed; top: 70px; left: -100%; width: 100%; background: rgba(10, 14, 26, 0.98); flex-direction: column; padding: 2rem; transition: left 0.3s; gap: 1.5rem; border-bottom: 1px solid rgba(108, 27, 140, 0.2); } .nav-links.active { left: 0; } .result-grid { grid-template-columns: 1fr; gap: 1.5rem; } .result-header .tracking-number-box { flex-direction: column; align-items: flex-start; } .result-header .tracking-number { font-size: 1.4rem; } .action-buttons { flex-direction: column; } .btn-primary, .btn-secondary { min-width: auto; width: 100%; } .logo img { height: 40px; } .result-page { padding: 4rem 4% 2rem; } .email-status-box { flex-direction: column; align-items: stretch; text-align: center; } .email-status-box .status-icons { justify-content: center; } }
        @media (max-width: 480px) { .result-header { padding: 1.5rem; } .info-card { padding: 1.2rem; } .info-row { flex-direction: column; gap: 2px; padding: 0.6rem 0; } .info-value { text-align: left; max-width: 100%; font-size: 0.85rem; } .result-header .tracking-number { font-size: 1.1rem; word-break: break-all; } .logo img { height: 35px; } .result-page { padding: 3rem 3% 2rem; } }
    </style>
</head>
<body>

    <!-- PDF Loading Overlay -->

                <a href="contact.html">Contact</a>

    </nav>

    <div class="result-page" id="resultPage">
        <a href="tracking.html" class="back-link"><i class="fas fa-arrow-left"></i> New Tracking</a>
        <div id="resultContent">
            <div style="text-align:center;padding:4rem;">
                <i class="fas fa-spinner fa-spin" style="font-size:2.5rem;color:#00f2fe;"></i>
                <p style="margin-top:1rem;color:rgba(255,255,255,0.4);">Loading package data...</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 SwiftLogix Logistics. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = window.location.origin;
        console.log('📍 API URL:', API_URL);

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });

        // ===== CONFETTI =====
        function launchConfetti() {
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);
            
            const colors = ['#00f2fe', '#6C1B8C', '#FF6600', '#ffd700', '#4CAF50', '#ff4444', '#0ff', '#fff'];
            
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 4) + 'px';
                confetti.style.height = (Math.random() * 8 + 4) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(confetti);
            }
            
            setTimeout(() => {
                container.remove();
            }, 5000);
        }

        // ===== SHIPMENT DATA =====
        let shipmentData = null;
        let trackingNumber = localStorage.getItem('trackingNumber');
        let receiverEmail = null; // Will be set from shipment data

        if (!trackingNumber) {
            trackingNumber = 'SL-3722-TAB2NLX6';
        }
        trackingNumber = trackingNumber.toUpperCase();

        console.log('🔍 Tracking Number:', trackingNumber);

        // ===== STATUS HELPERS =====
        function getStatusClass(status) {
            const map = {
                'order_confirmed': 'status-order_confirmed',
                'picked': 'status-picked',
                'onway': 'status-onway',
                'customs': 'status-customs',
                'delivered': 'status-delivered'
            };
            return map[status] || 'status-order_confirmed';
        }

        function getStatusIcon(status) {
            const map = {
                'order_confirmed': 'fa-clock',
                'picked': 'fa-box',
                'onway': 'fa-truck',
                'customs': 'fa-passport',
                'delivered': 'fa-check-circle'
            };
            return map[status] || 'fa-truck';
        }

        // ===== GENERATE QR CODE =====
        function generateSimpleQRCode(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 100, 100);
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash |= 0;
            }
            ctx.fillStyle = 'black';
            const seed = Math.abs(hash) % 100;
            ctx.fillRect(5, 5, 8, 8);
            ctx.fillRect(5, 87, 8, 8);
            ctx.fillRect(87, 5, 8, 8);
            for (let i = 0; i < 20; i++) {
                const x = 15 + (i * 3.5);
                const y = 15 + ((seed + i) % 70);
                ctx.fillRect(x, y, 3, 3);
            }
            for (let i = 0; i < 60; i++) {
                const x = 20 + (Math.sin(i * seed) * 60 + 30);
                const y = 25 + (Math.cos(i * (seed + 1)) * 50 + 25);
                if (x > 10 && x < 90 && y > 10 && y < 90) {
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            return canvas.toDataURL();
        }

        // ===== PDF GENERATION =====
        function downloadPDF() {
            if (!shipmentData) {
                alert('No shipment data to download');
                return;
            }
            
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
            btn.disabled = true;
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const inv = shipmentData.invoice || {};
            const now = new Date().toLocaleString();
            const dutyAmount = shipmentData.parcel?.dutyFeesAmount || shipmentData.parcel?.dutyFeesStatus || 'N/A';
            const statusText = shipmentData.statusText || shipmentData.status;
            const verifyUrl = `${window.location.origin}/verify?code=${trackingNumber}`;
            const qrDataUrl = generateSimpleQRCode(verifyUrl);
            
            doc.setFillColor(0, 162, 254);
            doc.circle(20, 15, 6, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text("SL", 17, 18);
            doc.setTextColor(0, 162, 254);

        // ===== SEND EMAILS AUTOMATICALLY TO RECEIVER =====
        async function autoSendEmails(trackingCode, receiverEmail) {
            if (!receiverEmail) {
                console.log('❌ No receiver email found in shipment');
                return;
            }

            console.log(`📧 Auto-sending emails to receiver: ${receiverEmail}...`);
            
            // Update email status box
            const statusBox = document.getElementById('emailStatusBox');
            if (statusBox) {
                statusBox.innerHTML = `
                    <span class="label">📧 Sending emails to:</span>
                    <span class="email">${receiverEmail}</span>
                    <div class="status-icons">
                        <span class="status-item pending">
                            <span class="icon"><i class="fas fa-spinner fa-spin"></i></span>
                            Tracking
                        </span>
                        <span class="status-item pending">
                            <span class="icon"><i class="fas fa-spinner fa-spin"></i></span>
                            Invoice
                        </span>
                    </div>
                `;
            }

            try {
                const response = await fetch(`${API_URL}/api/send-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trackingCode, userEmail: receiverEmail })
                });
                
                const data = await response.json();
                console.log('📥 Auto-email response:', data);
                
                // Update status box with results
                if (statusBox && data.success) {
                    const trackingStatus = data.emails?.tracking?.success;
                    const invoiceStatus = data.emails?.invoice?.success;
                    
                    statusBox.innerHTML = `
                        <span class="label">📧 Emails sent to:</span>
                        <span class="email">${receiverEmail}</span>
                        <div class="status-icons">
                            <span class="status-item ${trackingStatus ? 'sent' : 'failed'}">
                                <span class="icon"><i class="fas ${trackingStatus ? 'fa-check-circle' : 'fa-times-circle'}"></i></span>
                                Tracking ${trackingStatus ? '✅' : '❌'}
                            </span>
                            <span class="status-item ${invoiceStatus ? 'sent' : 'failed'}">
                                <span class="icon"><i class="fas ${invoiceStatus ? 'fa-check-circle' : 'fa-times-circle'}"></i></span>
                                Invoice ${invoiceStatus ? '✅' : '❌'}
                            </span>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Auto-email error:', error);
                if (statusBox) {
                    statusBox.innerHTML = `
                        <span class="label">📧 Email status:</span>
                        <span style="color:#ff4444;">Failed to send emails</span>
                    `;
                }
            }
        }

        // ===== RENDER TRACKING =====
        function renderTracking(shipment) {
            const container = document.getElementById('resultContent');
            const statusClass = getStatusClass(shipment.status);
            const inv = shipment.invoice || {};
            const dutyAmount = shipment.parcel?.dutyFeesAmount || 'N/A';
            const dutyStatus = shipment.parcel?.dutyFeesStatus || 'N/A';
            const dutyDisplay = dutyAmount !== 'N/A' ? dutyAmount : dutyStatus;

            // Get receiver email from shipment
            receiverEmail = shipment.receiver?.email || null;

            // Launch confetti if delivered
            if (shipment.status === 'delivered') {
                setTimeout(launchConfetti, 800);
            }

            let timelineHTML = '';
            if (shipment.timeline && shipment.timeline.length > 0) {
                timelineHTML = shipment.timeline.map(item => `
                    <div class="timeline-item ${item.completed ? 'completed' : ''} ${item.active ? 'active' : ''}">
                        <div class="timeline-date">${item.date}</div>
                        <div class="timeline-title">${item.title}</div>
                        <div class="timeline-desc">${item.desc}</div>
                    </div>
                `).join('');
            }

            // Build the HTML
            container.innerHTML = `
                <!-- Email Status Box - Shows receiver email -->
                <div class="email-status-box" id="emailStatusBox">
                    <span class="label">📧 Sending emails to:</span>
                    <span class="email">${receiverEmail || 'No email on file'}</span>
                    <div class="status-icons">
                        <span class="status-item pending">
                            <span class="icon"><i class="fas fa-spinner fa-spin"></i></span>
                            Tracking
                        </span>
                        <span class="status-item pending">
                            <span class="icon"><i class="fas fa-spinner fa-spin"></i></span>
                            Invoice
                        </span>
                    </div>
                </div>

                <!-- Header -->
                <div class="result-header">
                    <div class="tracking-number-box">
                        <div class="tracking-number"><i class="fas fa-barcode"></i> ${shipment.trackingCode}</div>
                        <div class="verified-badge"><i class="fas fa-check-circle"></i> Verified</div>
                    </div>
                    <div class="status-row">
                        <div class="status-badge ${statusClass}">
                            <i class="fas ${shipment.status === 'delivered' ? 'fa-check-circle' : shipment.status === 'customs' ? 'fa-clock' : 'fa-truck'}"></i>
                            ${shipment.statusText || shipment.status}
                        </div>
                        <div class="last-updated"><i class="fas fa-clock"></i> Last Updated: ${shipment.lastUpdated}</div>
                    </div>
                </div>

                <!-- Grid -->
                <div class="result-grid">
                    <div>
                        <div class="info-card">
                            <h3><i class="fas fa-user-tie"></i> Sender</h3>
                            <div class="info-row"><span class="info-label">Name:</span><span class="info-value">${shipment.sender?.name || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Country:</span><span class="info-value">${shipment.sender?.country || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Address:</span><span class="info-value">${shipment.sender?.address || shipment.sender?.country || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Phone:</span><span class="info-value">${shipment.sender?.phone || 'N/A'}</span></div>
                        </div>
                        <div class="info-card" style="margin-top:1.5rem;">
                            <h3><i class="fas fa-user-check"></i> Receiver</h3>
                            <div class="info-row"><span class="info-label">Name:</span><span class="info-value">${shipment.receiver?.name || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Country:</span><span class="info-value">${shipment.receiver?.country || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Address:</span><span class="info-value">${shipment.receiver?.address || shipment.receiver?.country || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Phone:</span><span class="info-value">${shipment.receiver?.phone || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Email:</span><span class="info-value" style="color:#00f2fe;">${shipment.receiver?.email || 'N/A'}</span></div>
                        </div>
                    </div>
                    <div>
                        <div class="info-card">
                            <h3><i class="fas fa-cube"></i> Package Details</h3>
                            <div class="info-row"><span class="info-label">Duty Fees:</span><span class="info-value" style="color:${dutyStatus === 'Paid' ? '#4CAF50' : '#ffa500'};"><i class="fas ${dutyStatus === 'Paid' ? 'fa-check-circle' : 'fa-clock'}"></i> ${dutyDisplay}</span></div>
                            <div class="info-row"><span class="info-label">Weight:</span><span class="info-value">${shipment.parcel?.weight || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Type:</span><span class="info-value">${shipment.parcel?.type || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Pickup:</span><span class="info-value">${shipment.parcel?.pickupDate || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">ETA:</span><span class="info-value" style="color:#00f2fe;">${shipment.parcel?.expectedDelivery || 'Pending'}</span></div>
                        </div>
                        <div class="info-card" style="margin-top:1.5rem;">
                            <h3><i class="fas fa-file-invoice"></i> Invoice Details</h3>
                            <div class="info-row"><span class="info-label">Order ID:</span><span class="info-value">${inv.orderId || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Booking Mode:</span><span class="info-value">${inv.bookingMode || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Shipping Cost:</span><span class="info-value">${inv.shipmentCost || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Clearance Cost:</span><span class="info-value">${inv.clearanceCost || 'N/A'}</span></div>
                            <div class="info-row" style="border-bottom:2px solid rgba(255,215,0,0.3);padding-bottom:12px;">
                                <span class="info-label" style="font-weight:700;color:#ffd700;">Total Amount:</span>
                                <span class="info-value" style="font-weight:700;color:#ffd700;font-size:1.1rem;">${inv.totalAmount || 'N/A'}</span>
                            </div>
                            <div class="info-row"><span class="info-label">Payment Status:</span><span class="info-value" style="color:${inv.paymentStatus === 'Paid' ? '#4CAF50' : '#ffa500'};"><i class="fas ${inv.paymentStatus === 'Paid' ? 'fa-check-circle' : 'fa-clock'}"></i> ${inv.paymentStatus || 'N/A'}</span></div>
                        </div>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="timeline-section">
                    <h3><i class="fas fa-timeline"></i> Shipment Journey</h3>
                    <div class="timeline">${timelineHTML}</div>
                </div>

                <!-- Map -->
                <div class="map-container">
                    <div id="map"></div>
                    <div class="map-caption">
                        <i class="fas fa-map-marker-alt"></i> Origin: ${shipment.origin || 'Unknown'} → Destination: ${shipment.destination || 'Unknown'}
                    </div>
                </div>

                <!-- Buttons -->
                <div class="action-buttons">
                    <button class="btn-primary" onclick="downloadPDF()"><i class="fas fa-download"></i> Download Invoice (PDF)</button>
                    <button class="btn-secondary" onclick="copyLink()"><i class="fas fa-share-alt"></i> Share Tracking</button>
                </div>
            `;

            // Store data for PDF
            window.currentShipment = shipment;

            // Initialize map
            setTimeout(() => {
                if (typeof L !== 'undefined') {
                    const coords = shipment.coordinates || [25.2048, 55.2708];
                    const map = L.map('map').setView(coords, 5);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(map);
                    L.marker(coords, {
                        icon: L.divIcon({
                            className: 'custom-marker',
                            html: '<i class="fas fa-map-pin" style="color:#00f2fe;font-size:30px;"></i>',
                            iconSize: [30, 30],
                            iconAnchor: [15, 30]
                        })
                    }).addTo(map)
                        .bindPopup(`<b>${shipment.origin}</b><br>${shipment.sender?.name || 'Sender'}`)
                        .openPopup();
                    
                    if (shipment.destination) {
                        const destCoords = [shipment.coordinates[0] + 10, shipment.coordinates[1] + 10];
                        L.marker(destCoords, {
                            icon: L.divIcon({
                                className: 'custom-marker',
                                html: '<i class="fas fa-flag-checkered" style="color:#FF6600;font-size:30px;"></i>',
                                iconSize: [30, 30],
                                iconAnchor: [15, 30]
                            })
                        }).addTo(map)
                            .bindPopup(`<b>${shipment.destination}</b><br>${shipment.receiver?.name || 'Receiver'}`);
                    }
                }
            }, 500);

            // ✅ AUTO-SEND EMAILS TO RECEIVER (Like Test Email)
            if (receiverEmail) {
                console.log('📧 Auto-sending emails to receiver on page load...');
                autoSendEmails(trackingNumber, receiverEmail);
            } else {
                console.log('❌ No receiver email found - skipping auto-send');
            }
        }

        // ===== LOAD TRACKING =====
        async function loadTracking() {
            try {
                console.log('🔍 Fetching shipment:', trackingNumber);
                const response = await fetch(`${API_URL}/api/track/${trackingNumber}`);
                
                if (!response.ok) {
                    throw new Error('Not found');
                }
                
                const data = await response.json();
                console.log('📥 Shipment data loaded:', data);
                shipmentData = data;
                renderTracking(data);
                
            } catch (error) {
                console.error('❌ Error loading tracking:', error);
                document.getElementById('resultContent').innerHTML = `
                    <div class="not-found">
                        <i class="fas fa-search"></i>
                        <h2>Tracking Number Not Found</h2>
                        <p>${trackingNumber} does not exist in our system</p>
                        <a href="tracking.html" class="btn-primary"><i class="fas fa-arrow-left"></i> Try Again</a>
                    </div>
                `;
            }
        }

        // ===== SHARE LINK =====
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('✅ Tracking link copied to clipboard!');
        }

        // ===== START =====
        console.log('✅ tracking-result.html loaded');
        loadTracking();
    </script>
