<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - SwiftLogix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .services-hero {
            padding: 8rem 5% 4rem;
            text-align: center;
        }
        .services-hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .services-hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
        }
        .services-grid-page { padding: 3rem 0 5rem; }
        .services-grid-page .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }
        .services-grid-page .service-card {
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            border: 1px solid var(--border);
            transition: all var(--transition);
            text-align: center;
            text-decoration: none;
            color: #fff;
        }
        .services-grid-page .service-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 50px rgba(0,242,254,0.08);
        }
        .services-grid-page .service-card .icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(0,242,254,0.15), rgba(0,242,254,0.05));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--primary);
            margin: 0 auto 1.2rem;
        }
        .services-grid-page .service-card h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .services-grid-page .service-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; }
        .services-grid-page .service-card .learn-more {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        @media (max-width: 992px) {
            .services-grid-page .grid { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 480px) {
            .services-hero h1 { font-size: 2.2rem; }
            .services-grid-page .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

            <div class="face bottom"></div>
        </div>
