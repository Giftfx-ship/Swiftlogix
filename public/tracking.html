<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Package - SwiftLogix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 20s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 600px;
            height: 600px;
            background: rgba(108, 27, 140, 0.15);
            top: -200px;
            right: -200px;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(0, 242, 254, 0.08);
            bottom: -150px;
            left: -150px;
            animation-delay: -5s;
        }
        
        .orb-3 {
            width: 400px;
            height: 400px;
            background: rgba(255, 102, 0, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }
        
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 40px) scale(0.9); }
            75% { transform: translate(30px, -20px) scale(1.05); }
        }
        
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 5%;
            background: rgba(10, 14, 26, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(108, 27, 140, 0.2);
        }
        
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo img {
            height: 50px;
            width: auto;
            display: block;
            transition: all 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6C1B8C, #00f2fe);
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }
        
        .nav-links a:hover {
            color: #fff;
        }
        
        .nav-links a.active {
            color: #00f2fe;
        }
        
        .track-btn {
            background: linear-gradient(135deg, #6C1B8C, #FF6600);
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            color: #fff !important;
            font-weight: 600 !important;
            transition: all 0.3s !important;
        }
        
        .track-btn::after {
            display: none !important;
        }
        
        .track-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 27, 140, 0.4);
        }
        
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
        }
        
        .track-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 5% 4rem;
            position: relative;
            z-index: 1;
        }
        
        .track-card {
            max-width: 620px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 3.5rem;
            border: 1px solid rgba(108, 27, 140, 0.2);
            backdrop-filter: blur(20px);
            position: relative;
            animation: fadeUp 0.8s ease forwards;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .track-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(108, 27, 140, 0.3), rgba(0, 242, 254, 0.1), rgba(255, 102, 0, 0.3));
            z-index: -1;
            opacity: 0.5;
        }
        
        .track-card .icon-top {
            text-align: center;
            font-size: 52px;
            margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .track-card .icon-top i {
            background: linear-gradient(135deg, #6C1B8C, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .track-card h1 {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #6C1B8C, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        
        .track-card .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .track-card .form-group {
            margin-bottom: 1.5rem;
        }
        
        .track-card .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        
        .track-card .form-group label i {
            color: #00f2fe;
            margin-right: 0.5rem;
        }
        
        .track-card .form-group input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        
        .track-card .form-group input:focus {
            outline: none;
            border-color: #6C1B8C;
            box-shadow: 0 0 0 4px rgba(108, 27, 140, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .track-card .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .track-card .email-hint {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 0.6rem;
        }
        
        .track-card .email-hint i {
            color: #00f2fe;
        }
        
        .track-card .track-btn {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #6C1B8C, #FF6600);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .track-card .track-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .track-card .track-btn:hover::before {
            left: 100%;
        }
        
        .track-card .track-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(108, 27, 140, 0.4);
        }
        
        .track-card .track-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .track-card .result-box {
            margin-top: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            display: none;
            align-items: center;
            gap: 0.8rem;
            animation: slideDown 0.4s ease forwards;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .track-card .result-box.success {
            display: flex;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4CAF50;
        }
        
        .track-card .result-box.error {
            display: flex;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }
        
        .track-card .result-box.info {
            display: flex;
            background: rgba(108, 27, 140, 0.1);
            border: 1px solid rgba(108, 27, 140, 0.2);
            color: #8B3AB8;
        }
        
        .track-card .result-box i {
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .track-card .result-box .result-content {
            flex: 1;
        }
        
        .track-card .result-box .result-content strong {
            display: block;
            font-size: 14px;
        }
        
        .track-card .result-box .result-content .small {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }
        
        .footer {
            background: rgba(6, 10, 22, 0.95);
            padding: 2rem 5%;
            text-align: center;
            border-top: 1px solid rgba(108, 27, 140, 0.2);
            position: relative;
            z-index: 1;
        }
        
        .footer p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
            
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                background: rgba(10, 14, 26, 0.98);
                flex-direction: column;
                padding: 2rem;
                transition: left 0.3s;
                gap: 1.5rem;
                border-bottom: 1px solid rgba(108, 27, 140, 0.2);
            }
            
            .nav-links.active {
                left: 0;
            }
            
            .track-card {
                padding: 2rem 1.5rem;
            }
            
            .track-card h1 {
                font-size: 1.8rem;
            }
            
            .logo img {
                height: 40px;
            }
        }
        
        @media (max-width: 480px) {
            .track-card {
                padding: 1.5rem 1rem;
            }
            
            .track-card h1 {
                font-size: 1.5rem;
            }
            
            .track-card .icon-top {
                font-size: 36px;
            }
            
            .logo img {
                height: 35px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="/images/logo.png" alt="SwiftLogix">
            </a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="tracking.html" class="active">Track</a>
                <a href="services.html">Services</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="blog.html">Blog</a>
                <a href="tracking.html" class="track-btn"><i class="fas fa-search"></i> Track</a>
            </div>
        </div>
    </nav>

    <section class="track-page">
        <div class="track-card">
            <div class="icon-top"><i class="fas fa-box-open"></i></div>
            <h1>Track Your Package</h1>
            <p class="subtitle">Enter your tracking number and email to receive real-time updates</p>

            <form id="trackForm">
                <div class="form-group">
                    <label><i class="fas fa-barcode"></i> Tracking Number</label>
                    <input type="text" id="trackingCode" placeholder="e.g., SL-3722-TAB2NLX6" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Your Email Address</label>
                    <input type="email" id="userEmail" placeholder="Enter your email to receive tracking updates" required>
                    <div class="email-hint">
                        <i class="fas fa-info-circle"></i>
                        <span>You'll receive tracking details. The receiver will get the full invoice.</span>
                    </div>
                </div>
                <button type="submit" class="track-btn" id="trackBtn">
                    <i class="fas fa-rocket"></i> Track Package
                </button>
            </form>

            <div id="resultBox" class="result-box"></div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 SwiftLogix Logistics. All rights reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });

        const API_URL = window.location.origin;
        document.getElementById('trackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const trackingCode = document.getElementById('trackingCode').value.trim().toUpperCase();
            const userEmail = document.getElementById('userEmail').value.trim();
            const btn = document.getElementById('trackBtn');
            const resultBox = document.getElementById('resultBox');

            if (!trackingCode || !userEmail) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <div class="result-content">
                        <strong>Please fill in both fields</strong>
                        <div class="small">Tracking number and email are required</div>
                    </div>
                `;
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Tracking...';
            resultBox.className = 'result-box info';
            resultBox.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                <div class="result-content">
                    <strong>Checking tracking number...</strong>
                    <div class="small">Please wait...</div>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/api/track`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trackingCode, userEmail })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    resultBox.className = 'result-box error';
                    resultBox.innerHTML = `
                        <i class="fas fa-exclamation-circle"></i>
                        <div class="result-content">
                            <strong>${data.error || 'Tracking number not found'}</strong>
                            <div class="small">Please check the tracking number and try again</div>
                        </div>
                    `;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-rocket"></i> Track Package';
                    return;
                }

                const toUserStatus = data.emails?.toUser?.success ? '✅' : '❌';
                const toReceiverStatus = data.emails?.toReceiver?.success ? '✅' : '❌';
                
                resultBox.className = 'result-box success';
                resultBox.innerHTML = `
                    <i class="fas fa-check-circle"></i>
                    <div class="result-content">
                        <strong>🎉 Package Found!</strong>
                        <div class="small">
                            📧 Tracking sent to you: ${toUserStatus} &nbsp;|&nbsp; 📄 Invoice sent to receiver: ${toReceiverStatus}
                        </div>
                        <div class="small" style="margin-top:4px;color:rgba(255,255,255,0.4);">
                            <i class="fas fa-spinner fa-spin"></i> Redirecting to tracking page...
                        </div>
                    </div>
                `;
                
                localStorage.setItem('trackingNumber', trackingCode);
                localStorage.setItem('trackingData', JSON.stringify(data.shipment));
                setTimeout(() => {
                    window.location.href = 'tracking-result.html';
                }, 2500);
            } catch (error) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <div class="result-content">
                        <strong>Network Error</strong>
                        <div class="small">Please check your connection and try again</div>
                    </div>
                `;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket"></i> Track Package';
            }
        });
    </script>
</body>
</html>
