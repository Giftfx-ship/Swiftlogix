<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SwiftLogix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#fff;min-height:100vh}

        .navbar{position:sticky;top:0;z-index:1000;padding:1rem 5%;background:rgba(10,14,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(108,27,140,0.2)}
        .nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo img{height:50px;width:auto;display:block;transition:all 0.3s ease}
        .logo img:hover{transform:scale(1.05);filter:brightness(1.1)}
        .nav-links{display:flex;gap:2rem;align-items:center}
        .nav-links a{color:#fff;text-decoration:none;transition:0.3s;font-size:14px}
        .nav-links a:hover{color:#8B3AB8}
        .nav-links a.active{color:#FF6600}
        .menu-toggle{display:none;font-size:1.5rem;cursor:pointer}

        .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:4rem 5%;background:url('/images/hero-bg.jpg') center/cover fixed;position:relative}
        .login-page::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,14,26,0.85);z-index:0}
        .login-container{max-width:440px;width:100%;background:rgba(255,255,255,0.05);border-radius:24px;padding:3rem;border:1px solid rgba(108,27,140,0.2);backdrop-filter:blur(20px);position:relative;z-index:1;animation:fadeUp 0.6s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .login-container .lock-icon{text-align:center;font-size:48px;color:#FF6600;margin-bottom:1rem}
        .login-container .logo-text{text-align:center;font-size:28px;font-weight:800;margin-bottom:0.3rem}
        .login-container .logo-text img{height:60px;width:auto;display:inline-block}
        .login-container .badge{text-align:center;color:#9aa8c9;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem}
        .login-container h2{text-align:center;font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:0.3rem}
        .login-container .sub{text-align:center;color:#9aa8c9;font-size:0.85rem;margin-bottom:2rem}
        .login-container .form-group{margin-bottom:1.5rem;position:relative}
        .login-container .form-group label{display:block;color:#9aa8c9;font-size:12px;font-weight:600;margin-bottom:0.5rem;letter-spacing:0.5px;text-transform:uppercase}
        .login-container .form-group .input-wrap{position:relative}
        .login-container .form-group .input-wrap i{position:absolute;left:1.2rem;top:50%;transform:translateY(-50%);color:#FF6600;font-size:16px}
        .login-container .form-group input{width:100%;padding:1rem 1rem 1rem 3.2rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:60px;color:#fff;font-size:1rem;transition:all 0.3s}
        .login-container .form-group input:focus{outline:none;border-color:#6C1B8C;box-shadow:0 0 0 4px rgba(108,27,140,0.15);background:rgba(255,255,255,0.08)}
        .login-container .form-group input::placeholder{color:#667799}
        .login-container .login-btn{width:100%;padding:1.1rem;background:linear-gradient(135deg,#6C1B8C,#FF6600);border:none;border-radius:60px;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:0.8rem;margin-top:0.5rem}
        .login-container .login-btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(108,27,140,0.35)}
        .login-container .login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
        .login-container .error-msg{color:#ff4444;font-size:13px;text-align:center;margin-top:1rem;display:none}
        .login-container .admin-hint{text-align:center;color:#667799;font-size:12px;margin-top:1.5rem;padding:1rem;background:rgba(255,255,255,0.03);border-radius:12px;border:1px dashed rgba(108,27,140,0.2)}
        .login-container .admin-hint i{color:#FF6600}
        .login-container .back-link{display:block;text-align:center;margin-top:1.5rem;color:#9aa8c9;font-size:13px;transition:color 0.3s;text-decoration:none}
        .login-container .back-link:hover{color:#FF6600}

        .footer{background:#060a16;padding:2rem 5%;text-align:center;border-top:1px solid rgba(108,27,140,0.2);margin-top:4rem}
        .footer p{color:#667799;font-size:13px}

        @media(max-width:768px){
            .menu-toggle{display:block}
            .nav-links{position:fixed;top:70px;left:-100%;width:100%;background:rgba(10,14,26,0.98);flex-direction:column;padding:2rem;transition:left 0.3s;gap:1.5rem}
            .nav-links.active{left:0}
            .login-container{padding:2rem 1.5rem}
            .logo img{height:40px}
        }
        @media(max-width:480px){
            .login-container{padding:1.5rem 1rem}
            .logo img{height:35px}
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="/images/logo.png" alt="SwiftLogix">
            </a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="tracking.html">Track</a>
                <a href="services.html">Services</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <section class="login-page">
        <div class="login-container">
            <div class="lock-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="logo-text">
                <img src="/images/logo.png" alt="SwiftLogix">
            </div>
            <div class="badge">✦ Administrator Portal ✦</div>
            <h2>Secure Login</h2>
            <p class="sub">Enter your credentials to access the admin dashboard</p>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <div id="errorMsg" class="error-msg"></div>
            </form>

            <div class="admin-hint">
                <i class="fas fa-key"></i>
                Default: <strong>igwe</strong> / <strong>dev</strong>
            </div>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 SwiftLogix Logistics. All rights reserved.</p>
    </footer>

    <script>
        document.querySelector('.menu-toggle')?.addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
        });

        const API_URL = window.location.origin;
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            if (!username || !password) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = '❌ Please fill in all fields';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = '❌ Invalid credentials. Access denied.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    return;
                }
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminUsername', data.admin.username);
                window.location.href = 'admin.html';
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = '❌ Network error. Please try again.';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });
    </script>
</body>
</html>
